services:
  phantomnet:
    build: .
    ports: ["2222:2222"]
    environment:
      - PHANTOMNET_BACKEND=anthropic        # or openai / mock
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes: ["./logs:/app/logs", "./data:/app/data"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
